apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: {app: vllm}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      enableServiceLinks: false
      containers:
      - name: vllm
        image: llm-serving:gpu
        imagePullPolicy: Never
        args: ["--model","Qwen/Qwen2.5-0.5B-Instruct",
               "--gpu-memory-utilization","0.35","--max-model-len","1024","--enforce-eager"]
        ports:
        - {containerPort: 8000}
        resources:
          limits: {nvidia.com/gpu: 1}
        volumeMounts:
        - {name: shm, mountPath: /dev/shm}
        startupProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 5
      volumes:
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  labels: {app: vllm}
spec:
  selector: {app: vllm}
  ports:
  - {port: 8000, targetPort: 8000, name: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: vllm
  namespaceSelector:
    matchNames: ["default"]
  endpoints:
  - port: http
    path: /metrics
    interval: 5s